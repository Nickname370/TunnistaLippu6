    let gameQuestions = [];
    let current = 0;
    let score = 0;
    let answered = false;

    function startGame() {
        gameQuestions = [...questions]
            .sort(() => Math.random() - 0.5)
            .slice(0, 70);

        current = 0;
        score = 0;
        answered = false;

        document.getElementById("score").textContent = score;
        document.getElementById("total").textContent = gameQuestions.length;
        document.getElementById("restartButton").hidden = true;
        document.getElementById("checkButton").hidden = false;
        document.getElementById("answer").hidden = false;

        showQuestion();
    }

    function showQuestion() {
        if (current >= gameQuestions.length) {
            endGame();
            return;
        }

        const q = gameQuestions[current];

        document.getElementById("number").textContent = current + 1;
        document.getElementById("picture").innerHTML =
    `<img src="${q.image}" alt="Tunnista lippu"
    style="max-width:100%; max-height:250px; object-fit:contain;">`;
        document.getElementById("answer").value = "";
        document.getElementById("answer").disabled = false;
        document.getElementById("feedback").textContent = "";

        answered = false;


        document.getElementById("answer").focus();
    }

    function checkAnswer() {
        if (answered) return;

        const input = document.getElementById("answer")
            .value.trim().toLocaleLowerCase("fi-FI");

        if (!input) {
            document.getElementById("feedback").textContent =
                "Kirjoita ensin vastaus!";
            return;
        }

        const q = gameQuestions[current];
        const correct = q.answers.some(
            answer => answer.toLocaleLowerCase("fi-FI") === input
        );

        answered = true;

        if (correct) {
            score++;
            document.getElementById("score").textContent = score;
            document.getElementById("feedback").textContent =
                "✅ Oikein! Hienosti tehty!";
            document.getElementById("feedback").style.color = "#4ade80";
        } else {
            document.getElementById("feedback").textContent =
                "❌ Väärin! Oikea vastaus: " + q.answers[0];
            document.getElementById("feedback").style.color = "#f87171";
        }

        document.getElementById("answer").disabled = true;
        document.getElementById("checkButton").disabled = true;

        setTimeout(() => {
            current++;
            showQuestion();
        }, 1500);
    }

    function endGame() {
        document.getElementById("picture").textContent = "🏆";
        document.getElementById("feedback").style.color = "#fbbf24";
        document.getElementById("feedback").textContent =
            "Peli päättyi! Sait " + score + " / " +
            gameQuestions.length + " pistettä!";

        document.getElementById("answer").hidden = true;
        document.getElementById("checkButton").hidden = true;
            score === 10 ? "Täydellinen tulos!" :
            score >= 7 ? "Todella hyvä tulos!" :
            "Yritä uudelleen ja paranna tulostasi!";

        document.getElementById("restartButton").hidden = false;
    }

    document.getElementById("answer").addEventListener("keydown", event => {
        if (event.key === "Enter") {
            checkAnswer();
        }
    });
